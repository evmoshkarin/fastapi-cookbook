name: CI

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linters
        run: |
          flake8 app.py database.py models.py schemas.py tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app.py database.py models.py schemas.py tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          black --check app.py database.py models.py schemas.py tests/
          isort --check-only app.py database.py models.py schemas.py tests/
          mypy app.py database.py models.py schemas.py tests/ --ignore-missing-imports

      - name: Run tests
        run: |
          pytest -v --cov=. --cov-report=xml

      - name: Upload coverage to Codecov (опционально)
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
